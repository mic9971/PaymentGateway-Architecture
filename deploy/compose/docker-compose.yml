# LOCAL DEMO ONLY — never deploy this mock service to production.
name: paymentgateway-demo
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: payment_demo
      POSTGRES_DB: payment_demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_demo -d payment_demo"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: demo
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 6s
      retries: 15

  api:
    build:
      context: ../..
      dockerfile: src/Gateway.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      MockPsp__WebhookSecret: "${MOCK_WEBHOOK_SECRET:?Set MOCK_WEBHOOK_SECRET in .env}"
      MerchantAuth__DevSigningKey: "${MERCHANT_DEV_JWT_KEY:?Set MERCHANT_DEV_JWT_KEY in .env}"
      ConnectionStrings__Payments: "Host=postgres;Port=5432;Database=payment_demo;Username=payment_demo;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env};Pooling=true"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: src/Gateway.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Payments: "Host=postgres;Port=5432;Database=payment_demo;Username=payment_demo;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env};Pooling=true"
      RabbitMq__Uri: "amqp://demo:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/"
      # Succeeded | Failed | Timeout | TimeoutBeforeEffect | TimeoutAfterSuccess
      MockPsp__Outcome: "${MOCK_PSP_OUTCOME:-Succeeded}"
      MockRefund__Outcome: "${MOCK_REFUND_OUTCOME:-Succeeded}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pg-data:
  rabbit-data:
